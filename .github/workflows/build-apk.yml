name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Finds where gradlew exists (repo root or subfolder like android/)
      - name: Locate gradlew
        id: locate
        shell: bash
        run: |
          set -e
          GRADLEW_PATH="$(find . -maxdepth 3 -type f -name gradlew | head -n 1)"
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Could not find gradlew in repo."
            exit 1
          fi
          chmod +x "$GRADLEW_PATH"
          GRADLEW_DIR="$(dirname "$GRADLEW_PATH")"
          echo "gradlew_path=$GRADLEW_PATH" >> $GITHUB_OUTPUT
          echo "gradlew_dir=$GRADLEW_DIR" >> $GITHUB_OUTPUT
          echo "Using gradlew at: $GRADLEW_PATH"

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd "${{ steps.locate.outputs.gradlew_dir }}"
          ./gradlew assembleDebug

      - name: Collect APKs
        id: collect
        shell: bash
        run: |
          set -e
          # Search from repo root for all debug APKs
          APK_LIST=$(find . -type f -name "*debug*.apk" || true)
          if [ -z "$APK_LIST" ]; then
            echo "No debug APK found."
            exit 1
          fi
          mkdir -p apk-out
          while IFS= read -r f; do
            cp "$f" apk-out/
          done <<< "$APK_LIST"
          echo "Found APK files:"
          ls -la apk-out
          echo "count=$(ls -1 apk-out/*.apk | wc -l)" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayWell-debug-apk
          path: apk-out/*.apk
          if-no-files-found: error

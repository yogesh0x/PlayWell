name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show repository structure (debug)
        shell: bash
        run: |
          echo "PWD: $(pwd)"
          ls -la
          echo "Searching gradlew..."
          find . -maxdepth 8 -type f -name "gradlew" -print || true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build debug APK (auto-detect gradlew)
        id: build_apk
        shell: bash
        run: |
          set -euo pipefail

          # Locate gradlew anywhere in repo
          GRADLEW_PATH="$(find . -maxdepth 8 -type f -name gradlew | head -n 1)"

          if [ -z "${GRADLEW_PATH:-}" ]; then
            echo "ERROR: gradlew not found."
            echo "Make sure Gradle wrapper files are committed:"
            echo "- gradlew"
            echo "- gradlew.bat"
            echo "- gradle/wrapper/gradle-wrapper.jar"
            echo "- gradle/wrapper/gradle-wrapper.properties"
            exit 1
          fi

          chmod +x "$GRADLEW_PATH"
          GRADLEW_DIR="$(dirname "$GRADLEW_PATH")"

          echo "Using gradlew: $GRADLEW_PATH"
          echo "Gradle dir: $GRADLEW_DIR"

          cd "$GRADLEW_DIR"
          ./gradlew assembleDebug --no-daemon

      - name: Collect APK files
        id: collect_apk
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p apk-out

          # Collect all APKs produced in repo
          mapfile -t APK_FILES < <(find . -type f -name "*.apk")

          if [ "${#APK_FILES[@]}" -eq 0 ]; then
            echo "ERROR: No APK files found after build."
            exit 1
          fi

          for f in "${APK_FILES[@]}"; do
            echo "Found APK: $f"
            cp "$f" apk-out/
          done

          echo "APK output folder:"
          ls -la apk-out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayWell-APK
          path: apk-out/*.apk
          if-no-files-found: error
